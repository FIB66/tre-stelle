<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QR Code - Tre Stelle</title>
<style>
*{ box-sizing:border-box; margin:0; padding:0; }

/* Palette del menu cartaceo 2026 (vedi index.html) */
:root{
  --navy:#2E3092;
  --grigio:#6D6E71;
}

body{
  font-family:'Georgia', serif;
  background:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
}

.card{
  width:300px;
  text-align:center;
  border:3px solid var(--navy);
  border-radius:16px;
  padding:28px 24px;
  background:white;
}

.stelle{
  margin-bottom:8px;
}

.stelle img{
  width:96px;
  height:auto;
}

/* Il nome è il logotipo calligrafico del cartaceo: h1 resta per gli screen reader */
h1{
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
  clip-path:inset(50%);
  white-space:nowrap;
}

.logotipo{
  width:210px;
  max-width:100%;
  height:auto;
  display:block;
  margin:0 auto 4px;
}

.dal{
  font-size:13px;
  color:var(--grigio);
  letter-spacing:2px;
  margin-bottom:20px;
}

.qr-box{
  background:#f9f9f9;
  border-radius:10px;
  padding:12px;
  margin-bottom:16px;
  display:inline-block;
}

.qr-box img{
  width:180px;
  height:180px;
  display:block;
}

.istruzione{
  font-size:13px;
  color:#555;
  margin-bottom:6px;
  line-height:1.5;
}

.url{
  font-size:11px;
  color:#aaa;
  word-break:break-all;
}

.divider{
  border:none;
  border-top:1px solid #eee;
  margin:16px 0;
}

@media print {
  body{ min-height:auto; padding:0; }
  .no-print{ display:none; }
}
</style>
</head>
<body>

<a href="index.html" class="no-print" style="position:fixed;top:20px;left:20px;display:inline-flex;align-items:center;gap:6px;background:#2E3092;color:white;text-decoration:none;padding:10px 18px;border-radius:8px;font-size:15px;">← Home</a>

<div class="card">
  <div class="stelle"><img src="tre-stelle.svg" alt="" aria-hidden="true"></div>
  <h1>Ristorante Tre Stelle</h1>
  <img class="logotipo" src="logotipo.svg" alt="Ristorante Tre Stelle">
  <div class="dal">Dal 1927 · Castelraimondo</div>

  <div class="qr-box">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=https://3stelle.eu/menu.html&color=2E3092&bgcolor=f9f9f9" alt="QR Menu">
  </div>

  <p class="istruzione">📱 Inquadra il codice<br>per vedere il menu del giorno</p>

  <hr class="divider">

  <p class="url">3stelle.eu/menu.html</p>
</div>

<div class="no-print" style="position:fixed;bottom:20px;right:20px;">
  <button onclick="window.print()" style="background:#2E3092;color:white;border:none;padding:12px 24px;border-radius:8px;font-size:15px;cursor:pointer;">🖨️ Stampa</button>
</div>

</body>
</html>
