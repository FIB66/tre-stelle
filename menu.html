<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Menu del Giorno - Tre Stelle</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7A1F26">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tre Stelle">
<link rel="apple-touch-icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>
*{ box-sizing:border-box; margin:0; padding:0; }

body{
  font-family:'Open Sans', sans-serif;
  background:#1a1a1a;
  color:white;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
}

header, .prezzi, .data, .grid{
  width:40%;
  min-width:300px;
}

header{
  background:#7A1F26;
  padding:10px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

header a{
  color:white;
  text-decoration:none;
  font-size:14px;
  opacity:0.8;
}

header h1{
  font-family:'Playfair Display', serif;
  font-size:20px;
  letter-spacing:3px;
}

.prezzi{
  display:flex;
  gap:8px;
  padding:6px 10px;
  justify-content:center;
}

.prezzo-box{
  flex:1;
  max-width:200px;
  background:#F4A820;
  color:#1a1a1a;
  border-radius:8px;
  text-align:center;
  padding:5px 8px;
}

.prezzo-box .cifra{
  font-size:20px;
  font-weight:700;
  line-height:1;
}

.prezzo-box .label{
  font-size:10px;
  font-weight:700;
  margin-top:2px;
  text-transform:uppercase;
}

.data{
  text-align:center;
  font-size:13px;
  color:#aaa;
  letter-spacing:1px;
  text-transform:uppercase;
  padding-bottom:10px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  column-gap:4px;
  row-gap:0px;
  padding:4px 10px;
  flex:1;
}

.colonna{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.sezione{
  background:#2a2a2a;
  border-radius:10px;
  padding:10px;
}

.sezione-titolo{
  font-size:10px;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#F4A820;
  margin-bottom:8px;
  text-align:center;
}

.piatto{
  font-size:14px;
  font-weight:700;
  padding:5px 0;
  border-bottom:1px solid #3a3a3a;
  line-height:1.2;
  text-align:center;
}

.piatto:last-child{
  border-bottom:none;
  padding-bottom:0;
}

.contorni-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.contorno{
  font-size:15px;
  font-weight:700;
  background:#333;
  border-radius:8px;
  padding:8px 10px;
  text-align:center;
}

.contorni-grid .contorno:last-child:nth-child(odd){
  grid-column:1/-1;
}

/* Tooltip */
.piatto, .contorno{
  position:relative;
  cursor:pointer;
}

.piatto .tip, .contorno .tip{
  display:none;
  position:absolute;
  bottom:calc(100% + 8px);
  left:50%;
  transform:translateX(-50%);
  background:#1a1a1a;
  border:2px solid #F4A820;
  color:white;
  font-size:11px;
  font-weight:400;
  border-radius:10px;
  white-space:nowrap;
  z-index:10;
  pointer-events:none;
  overflow:hidden;
  width:160px;
  white-space:normal;
  text-align:center;
}

.piatto .tip img, .contorno .tip img{
  width:100%;
  height:90px;
  object-fit:cover;
  display:block;
}

.piatto .tip span, .contorno .tip span{
  display:block;
  padding:5px 8px;
  font-size:11px;
  color:#ccc;
}

.piatto .tip::after, .contorno .tip::after{
  content:'';
  position:absolute;
  top:100%;
  left:50%;
  transform:translateX(-50%);
  border:5px solid transparent;
  border-top-color:#F4A820;
}

.piatto:hover .tip, .contorno:hover .tip,
.piatto:focus .tip, .contorno:focus .tip{
  display:block;
}

/* Loading / errore */
.stato{
  grid-column:1/-1;
  text-align:center;
  padding:40px 20px;
  color:#aaa;
  font-size:14px;
}
</style>
</head>

<body>

<header>
  <a href="index.html">← Home</a>
  <h1>TRE STELLE</h1>
  <a href="https://docs.google.com/spreadsheets/d/1AWUqkjdrz9x8Dm0-9UIwPdF5A-4y0dksZ2gxDn9sKKA/edit" target="_blank" style="font-size:18px" title="Modifica menu">✏️</a>
</header>

<div class="prezzi" id="prezzi"></div>
<div class="data" id="data">Caricamento...</div>
<div class="grid" id="grid"><div class="stato">Caricamento menu...</div></div>

<script>
// ↓ Sostituisci con il tuo URL dopo aver pubblicato lo script
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbylV2bKPv3M8t8YrXQOZLTJJ_Sz3bRZPEK7d1V3P7gctycXpAgFAZT-JySdCYctLmUe0g/exec';

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

function makeTip(item) {
  if (!item.ingredienti && !item.foto) return '';
  const img = item.foto ? `<img src="${item.foto}" alt="" loading="lazy">` : '';
  const txt = item.ingredienti ? `<span>${item.ingredienti}</span>` : '';
  return `<div class="tip">${img}${txt}</div>`;
}

function renderMenu(dati) {
  // Prezzi
  document.getElementById('prezzi').innerHTML = `
    <div class="prezzo-box">
      <div class="cifra">€ ${dati.prezzoCompleto}</div>
      <div class="label">Menu completo</div>
    </div>
    <div class="prezzo-box" style="background:#e8e8e8">
      <div class="cifra">€ ${dati.prezzoMezzo}</div>
      <div class="label">Mezzo menu</div>
    </div>`;

  // Data
  document.getElementById('data').textContent = dati.data;

  // Grid
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const { Primi, Secondi, Contorni } = dati.sezioni;

  // Colonna Primi
  if (Primi) {
    const col = document.createElement('div');
    col.className = 'colonna';
    col.innerHTML = `
      <div class="sezione">
        <div class="sezione-titolo">Primi</div>
        ${Primi.map(p => `<div class="piatto" tabindex="0">${p.nome}${makeTip(p)}</div>`).join('')}
      </div>`;
    grid.appendChild(col);
  }

  // Colonna Secondi
  if (Secondi) {
    const col = document.createElement('div');
    col.className = 'colonna';
    col.innerHTML = `
      <div class="sezione">
        <div class="sezione-titolo">Secondi</div>
        ${Secondi.map(p => `<div class="piatto" tabindex="0">${p.nome}${makeTip(p)}</div>`).join('')}
      </div>`;
    grid.appendChild(col);
  }

  // Contorni (larghezza piena)
  if (Contorni) {
    const col = document.createElement('div');
    col.className = 'colonna';
    col.style.gridColumn = '1/-1';
    col.style.marginTop = '-6px';
    col.innerHTML = `
      <div class="sezione">
        <div class="sezione-titolo">Contorni</div>
        <div class="contorni-grid">
          ${Contorni.map(c => `<div class="contorno" tabindex="0">${c.nome}${makeTip(c)}</div>`).join('')}
        </div>
      </div>`;
    grid.appendChild(col);
  }
}

fetch(SCRIPT_URL)
  .then(r => r.json())
  .then(renderMenu)
  .catch(() => {
    document.getElementById('grid').innerHTML =
      '<div class="stato">Menu non disponibile. Riprova più tardi.</div>';
  });
</script>
</body>
</html>
