<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Menu del Giorno - Tre Stelle</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2E3092">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tre Stelle">
<link rel="apple-touch-icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>
*{ box-sizing:border-box; margin:0; padding:0; }

/* Palette e damascato presi dal menu cartaceo 2026 (vedi index.html) */
:root{
  --navy:#2E3092;
  --lilla:#8182BD;
  --carta:#FFFFFF;
  --avorio:#F7F7F7;
  --grigio:#6D6E71;
  --grigio-chiaro:#E1E2E1;
}

body{
  font-family:'Open Sans', sans-serif;
  background:var(--carta) url('damasco.png') repeat;
  background-size:313px 306px;
  color:var(--navy);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
}

header, .prezzi, .data, .grid{
  width:40%;
  min-width:300px;
}

header{
  background:var(--navy);
  color:var(--carta);
  padding:10px 16px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.header-top{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  min-height:24px;
}

header a{
  position:absolute;
  left:0;
  color:white;
  text-decoration:none;
  font-size:20px;
  opacity:0.8;
  white-space:nowrap;
}

header h1{
  font-family:'Playfair Display', serif;
  font-size:18px;
  letter-spacing:2px;
  text-align:center;
}

.lang-switcher{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  align-items:center;
  justify-content:center;
}

.lang-btn{
  background:none;
  border:2px solid transparent;
  cursor:pointer;
  padding:0;
  border-radius:3px;
  line-height:1;
  transition:border-color 0.2s, opacity 0.2s;
  opacity:0.55;
}

.lang-btn img{
  display:block;
  width:24px;
  height:16px;
  object-fit:cover;
  border-radius:2px;
}

.lang-btn.active{
  opacity:1;
  border-color:var(--carta);
}

.lang-btn:hover{
  opacity:0.85;
}

.prezzi{
  display:flex;
  gap:8px;
  padding:6px 10px;
  justify-content:center;
}

.prezzo-box{
  flex:1;
  max-width:200px;
  background:var(--navy);
  color:var(--carta);
  border-radius:8px;
  text-align:center;
  padding:5px 8px;
}

.prezzo-box .cifra{
  font-size:20px;
  font-weight:700;
  line-height:1;
}

.prezzo-box .label{
  font-size:10px;
  font-weight:700;
  margin-top:2px;
  text-transform:uppercase;
}

.incluso{
  width:40%;
  min-width:300px;
  text-align:center;
  font-size:11px;
  color:var(--grigio);
  font-style:italic;
  letter-spacing:0.3px;
  padding:4px 10px 2px;
}

.data{
  text-align:center;
  font-size:13px;
  font-weight:700;
  color:var(--navy);
  letter-spacing:1px;
  text-transform:uppercase;
  padding-bottom:10px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  column-gap:4px;
  row-gap:0px;
  padding:4px 10px;
  flex:1;
}

.colonna{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.sezione{
  background:var(--carta);
  border:1px solid var(--grigio-chiaro);
  border-top:3px solid var(--lilla);
  border-radius:10px;
  padding:10px;
}

.sezione-titolo{
  font-size:10px;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--navy);
  margin-bottom:8px;
  text-align:center;
}

.piatto{
  font-size:14px;
  font-weight:700;
  padding:5px 0;
  border-bottom:1px solid var(--grigio-chiaro);
  line-height:1.2;
  text-align:center;
}

.piatto:last-child{
  border-bottom:none;
  padding-bottom:0;
}

.contorni-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.contorno{
  font-size:15px;
  font-weight:700;
  background:var(--avorio);
  border:1px solid var(--grigio-chiaro);
  border-radius:8px;
  padding:8px 10px;
  text-align:center;
}

.contorni-grid .contorno:last-child:nth-child(odd){
  grid-column:1/-1;
}

/* Tooltip */
.piatto, .contorno{
  position:relative;
  cursor:pointer;
}

.piatto .tip, .contorno .tip{
  display:none;
  position:absolute;
  bottom:calc(100% + 8px);
  left:50%;
  transform:translateX(-50%);
  background:var(--navy);
  border:2px solid var(--navy);
  color:white;
  font-size:11px;
  font-weight:400;
  border-radius:10px;
  z-index:10;
  pointer-events:none;
  overflow:hidden;
  width:160px;
  white-space:normal;
  text-align:center;
}

.piatto .tip span, .contorno .tip span{
  display:block;
  padding:5px 8px;
  font-size:11px;
  color:var(--grigio-chiaro);
}

.piatto .tip::after, .contorno .tip::after{
  content:'';
  position:absolute;
  top:100%;
  left:50%;
  transform:translateX(-50%);
  border:5px solid transparent;
  border-top-color:var(--navy);
}

.piatto.active .tip, .contorno.active .tip{
  display:block;
}

/* Loading / errore */
.stato{
  grid-column:1/-1;
  text-align:center;
  padding:40px 20px;
  color:var(--grigio);
  font-size:14px;
}

.num{
  color:#FFD000;
  font-size:18px;
  font-weight:700;
  opacity:1;
}

/* Indicatore traduzione in corso */
.traduzione-in-corso .nome{
  opacity:0.5;
}
</style>
</head>

<body>

<header>
  <div class="header-top">
    <a href="index.html" title="Home">←</a>
    <h1>TRE STELLE</h1>
    <button class="lang-btn active" id="btn-it" onclick="setLang('it')" title="Italiano"><img src="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/flags/4x3/it.svg" alt="IT"></button>
  </div>
  <div class="lang-switcher">
    <button class="lang-btn" id="btn-en" onclick="setLang('en')" title="English"><img src="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/flags/4x3/gb.svg" alt="EN"></button>
    <button class="lang-btn" id="btn-es" onclick="setLang('es')" title="Español"><img src="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/flags/4x3/es.svg" alt="ES"></button>
    <button class="lang-btn" id="btn-ar" onclick="setLang('ar')" title="العربية"><img src="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/flags/4x3/sa.svg" alt="AR"></button>
    <button class="lang-btn" id="btn-pt" onclick="setLang('pt')" title="Português"><img src="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/flags/4x3/pt.svg" alt="PT"></button>
    <button class="lang-btn" id="btn-ru" onclick="setLang('ru')" title="Русский"><img src="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/flags/4x3/ru.svg" alt="RU"></button>
    <button class="lang-btn" id="btn-fr" onclick="setLang('fr')" title="Français"><img src="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/flags/4x3/fr.svg" alt="FR"></button>
    <button class="lang-btn" id="btn-sq" onclick="setLang('sq')" title="Shqip"><img src="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/flags/4x3/al.svg" alt="SQ"></button>
    <button class="lang-btn" id="btn-ro" onclick="setLang('ro')" title="Română"><img src="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/flags/4x3/ro.svg" alt="RO"></button>
  </div>
</header>

<div class="prezzi" id="prezzi"></div>
<div class="incluso" id="incluso"></div>
<div class="data" id="data">Caricamento...</div>
<div class="grid" id="grid"><div class="stato">Caricamento menu...</div></div>

<script>
// Deployment "FINALE" — legge Config!A3:C3 (versione corretta)
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxczilq2ynSUZv5cS9BjdpZTIQcDL07ZhOkCgi0QKJuzyOf5cw1EDKRe4WJ67AYynk0Yw/exec';

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function formatData(v) {
  const d = new Date(v);
  if (isNaN(d)) return v;
  const s = d.toLocaleDateString('it-IT', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric',
    timeZone: 'Europe/Rome'
  });
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function formatPrezzo(v) {
  if (typeof v === 'number') {
    return v % 1 === 0 ? String(v) : v.toFixed(2).replace('.', ',');
  }
  const s = String(v);
  if (/^\d{4}-\d{2}-\d{2}T/.test(s)) {
    const d = new Date(s);
    if (!isNaN(d)) return (d.getUTCHours() + d.getUTCMinutes() / 100).toFixed(2).replace('.', ',');
  }
  return s;
}

const T = {
  it: { primi:'Primi', secondi:'Secondi', contorni:'Contorni', completo:'Menu completo', mezzo:'Mezzo menu', incluso:'Compreso minerale e ¼ vino della casa' },
  en: { primi:'First courses', secondi:'Main courses', contorni:'Side dishes', completo:'Full menu', mezzo:'Half menu', incluso:'Mineral water and ¼ house wine included' },
  es: { primi:'Primeros', secondi:'Segundos', contorni:'Guarniciones', completo:'Menú completo', mezzo:'Medio menú', incluso:'Agua mineral y ¼ de vino de la casa incluidos' },
  ar: { primi:'أطباق أولى', secondi:'أطباق رئيسية', contorni:'أطباق جانبية', completo:'القائمة الكاملة', mezzo:'نصف قائمة', incluso:'مياه معدنية وربع نبيذ البيت شاملة' },
  pt: { primi:'Primeiros pratos', secondi:'Pratos principais', contorni:'Acompanhamentos', completo:'Menu completo', mezzo:'Meia ementa', incluso:'Água mineral e ¼ de vinho da casa incluídos' },
  ru: { primi:'Первые блюда', secondi:'Вторые блюда', contorni:'Гарниры', completo:'Полное меню', mezzo:'Полу-меню', incluso:'Минеральная вода и ¼ вина заведения включены' },
  fr: { primi:'Entrées', secondi:'Plats principaux', contorni:'Accompagnements', completo:'Menu complet', mezzo:'Demi-menu', incluso:'Eau minérale et ¼ de vin de la maison compris' },
  sq: { primi:'Pjata të para', secondi:'Pjata kryesore', contorni:'Garnitura', completo:'Menu i plotë', mezzo:'Gjysmë menu', incluso:'Ujë mineral dhe ¼ verë e shtëpisë të përfshira' },
  ro: { primi:'Feluri principale', secondi:'Feluri secundare', contorni:'Garnituri', completo:'Meniu complet', mezzo:'Jumătate de meniu', incluso:'Apă minerală și ¼ vin de casă incluse' }
};

let currentLang = 'it';
const cache = {};
let nomiOriginali = [];

function makeTip(item) {
  if (!item.ingredienti) return '';
  return `<div class="tip"><span>${esc(item.ingredienti)}</span></div>`;
}

function renderMenu(dati) {
  document.getElementById('prezzi').innerHTML = `
    <div class="prezzo-box">
      <div class="cifra">€ ${esc(formatPrezzo(dati.prezzoCompleto))}</div>
      <div class="label" data-label="completo">${T.it.completo}</div>
    </div>
    <div class="prezzo-box" style="background:#e8e8e8">
      <div class="cifra">€ ${esc(formatPrezzo(dati.prezzoMezzo))}</div>
      <div class="label" data-label="mezzo">${T.it.mezzo}</div>
    </div>`;

  const oggi = new Date().toLocaleDateString('it-IT', {
    weekday:'long', day:'numeric', month:'long', year:'numeric', timeZone:'Europe/Rome'
  });
  const dataStr = oggi.charAt(0).toUpperCase() + oggi.slice(1);
  document.getElementById('data').textContent = dataStr;
  document.getElementById('incluso').textContent = T.it.incluso;

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const find = name => {
    const key = Object.keys(dati.sezioni).find(k => k.toLowerCase() === name.toLowerCase());
    return key ? dati.sezioni[key] : null;
  };
  const Primi    = find('primi');
  const Secondi  = find('secondi');
  const Contorni = find('contorni');

  let n = 1;

  if (Primi) {
    const col = document.createElement('div');
    col.className = 'colonna';
    col.innerHTML = `
      <div class="sezione">
        <div class="sezione-titolo" data-label="primi">${T.it.primi}</div>
        ${Primi.map(p => `<div class="piatto" tabindex="0"><span class="num">${n++}.</span> <span class="nome">${esc(p.nome)}</span>${makeTip(p)}</div>`).join('')}
      </div>`;
    grid.appendChild(col);
  }

  if (Secondi) {
    const col = document.createElement('div');
    col.className = 'colonna';
    col.innerHTML = `
      <div class="sezione">
        <div class="sezione-titolo" data-label="secondi">${T.it.secondi}</div>
        ${Secondi.map(p => `<div class="piatto" tabindex="0"><span class="num">${n++}.</span> <span class="nome">${esc(p.nome)}</span>${makeTip(p)}</div>`).join('')}
      </div>`;
    grid.appendChild(col);
  }

  if (Contorni) {
    const col = document.createElement('div');
    col.className = 'colonna';
    col.style.gridColumn = '1/-1';
    col.style.marginTop = '-6px';
    col.innerHTML = `
      <div class="sezione">
        <div class="sezione-titolo" data-label="contorni">${T.it.contorni}</div>
        <div class="contorni-grid">
          ${Contorni.map(c => `<div class="contorno" tabindex="0"><span class="num">${n++}.</span> <span class="nome">${esc(c.nome)}</span>${makeTip(c)}</div>`).join('')}
        </div>
      </div>`;
    grid.appendChild(col);
  }

  nomiOriginali = Array.from(document.querySelectorAll('.nome')).map(el => ({
    el,
    testo: el.textContent
  }));
}

async function tradurciPiatti(lang) {
  if (lang === 'it') {
    nomiOriginali.forEach(({ el, testo }) => el.textContent = testo);
    return;
  }

  if (cache[lang]) {
    cache[lang].forEach((testo, i) => {
      if (nomiOriginali[i]) nomiOriginali[i].el.textContent = testo;
    });
    return;
  }

  document.getElementById('grid').classList.add('traduzione-in-corso');

  const SEP = ' || ';
  const testi = nomiOriginali.map(n => n.testo);
  const chunks = [];
  let chunk = [], len = 0;
  for (const t of testi) {
    if (len + t.length + SEP.length > 450 && chunk.length) {
      chunks.push(chunk); chunk = []; len = 0;
    }
    chunk.push(t);
    len += t.length + SEP.length;
  }
  if (chunk.length) chunks.push(chunk);

  try {
    const tradotti = [];
    for (const c of chunks) {
      const q = c.join(SEP);
      const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(q)}&langpair=it|${lang}`);
      const json = await res.json();
      const parti = json.responseData.translatedText.split(SEP);
      tradotti.push(...parti.map((t, i) => t.trim() || c[i]));
    }
    cache[lang] = tradotti;
    tradotti.forEach((testo, i) => {
      if (nomiOriginali[i]) nomiOriginali[i].el.textContent = testo;
    });
  } catch {
    // In caso di errore mantiene i nomi italiani
  }

  document.getElementById('grid').classList.remove('traduzione-in-corso');
}

function applicaEtichette(lang) {
  const t = T[lang];
  document.querySelectorAll('[data-label]').forEach(el => {
    const key = el.getAttribute('data-label');
    if (t[key]) el.textContent = t[key];
  });
  document.getElementById('incluso').textContent = t.incluso;
}

async function setLang(lang) {
  if (lang === currentLang) return;
  currentLang = lang;

  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + lang).classList.add('active');

  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

  applicaEtichette(lang);
  await tradurciPiatti(lang);
}

fetch(SCRIPT_URL + '?t=' + Date.now())
  .then(r => r.json())
  .then(renderMenu)
  .catch(() => {
    document.getElementById('grid').innerHTML =
      '<div class="stato">Menu non disponibile. Riprova più tardi.</div>';
  });

document.addEventListener('click', e => {
  const el = e.target.closest('.piatto, .contorno');
  if (el) {
    const wasActive = el.classList.contains('active');
    document.querySelectorAll('.piatto.active, .contorno.active')
      .forEach(x => x.classList.remove('active'));
    if (!wasActive) el.classList.add('active');
    e.stopPropagation();
  } else {
    document.querySelectorAll('.piatto.active, .contorno.active')
      .forEach(x => x.classList.remove('active'));
  }
});
</script>
</body>
</html>
