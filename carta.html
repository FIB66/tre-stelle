<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Menù alla Carta - Tre Stelle</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2E3092">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tre Stelle">
<link rel="apple-touch-icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>
*{ box-sizing:border-box; margin:0; padding:0; }

/* Palette e damascato presi dal menu cartaceo 2026 (vedi index.html) */
:root{
  --navy:#2E3092;
  --lilla:#8182BD;
  --carta:#FFFFFF;
  --avorio:#F7F7F7;
  --grigio:#6D6E71;
  --grigio-chiaro:#E1E2E1;
}

body{
  font-family:'Open Sans', sans-serif;
  background:var(--carta) url('damasco.png') repeat;
  background-size:313px 306px;
  color:var(--navy);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
}

header, .titolo-pagina, .lista{
  width:40%;
  min-width:300px;
}

header{
  background:var(--navy);
  color:var(--carta);
  padding:10px 16px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.header-top{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  min-height:24px;
}

header a{
  position:absolute;
  left:0;
  color:white;
  text-decoration:none;
  font-size:20px;
  opacity:0.8;
  white-space:nowrap;
}

header h1{
  font-family:'Playfair Display', serif;
  font-size:18px;
  letter-spacing:2px;
  text-align:center;
}

.lang-switcher{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  align-items:center;
  justify-content:center;
}

.lang-btn{
  background:none;
  border:2px solid transparent;
  cursor:pointer;
  padding:0;
  border-radius:3px;
  line-height:1;
  transition:border-color 0.2s, opacity 0.2s;
  opacity:0.55;
}

.lang-btn img{
  display:block;
  width:24px;
  height:16px;
  object-fit:cover;
  border-radius:2px;
}

.lang-btn.active{
  opacity:1;
  border-color:var(--carta);
}

.lang-btn:hover{
  opacity:0.85;
}

.titolo-pagina{
  text-align:center;
  font-family:'Playfair Display', serif;
  font-size:22px;
  color:var(--navy);
  letter-spacing:1px;
  padding:16px 10px 4px;
}

.lista{
  display:flex;
  flex-direction:column;
  gap:6px;
  padding:10px;
  flex:1;
}

.piatto{
  display:flex;
  align-items:baseline;
  gap:8px;
  background:var(--carta);
  border:1px solid var(--grigio-chiaro);
  border-radius:10px;
  padding:11px 14px;
}

.piatto .nome{
  flex:1;
  font-size:15px;
  font-weight:700;
  line-height:1.25;
}

.piatto .leader{
  flex:1;
  border-bottom:1px dotted var(--lilla);
  transform:translateY(-3px);
  min-width:10px;
}

.piatto .prezzo{
  font-size:15px;
  font-weight:700;
  color:var(--navy);
  white-space:nowrap;
}

.sezione-titolo{
  text-align:center;
  font-family:'Playfair Display', serif;
  font-size:17px;
  color:var(--navy);
  letter-spacing:2px;
  text-transform:uppercase;
  margin:20px 0 4px;
}

.sezione-titolo:first-child{
  margin-top:6px;
}

.stato{
  text-align:center;
  padding:40px 20px;
  color:var(--grigio);
  font-size:14px;
}

/* Indicatore traduzione in corso */
.traduzione-in-corso .nome{
  opacity:0.5;
}
</style>
</head>

<body>

<header>
  <div class="header-top">
    <a href="index.html" title="Home">←</a>
    <h1>TRE STELLE</h1>
    <button class="lang-btn active" id="btn-it" onclick="setLang('it')" title="Italiano"><img src="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/flags/4x3/it.svg" alt="IT"></button>
  </div>
  <div class="lang-switcher">
    <button class="lang-btn" id="btn-en" onclick="setLang('en')" title="English"><img src="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/flags/4x3/gb.svg" alt="EN"></button>
    <button class="lang-btn" id="btn-es" onclick="setLang('es')" title="Español"><img src="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/flags/4x3/es.svg" alt="ES"></button>
    <button class="lang-btn" id="btn-ar" onclick="setLang('ar')" title="العربية"><img src="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/flags/4x3/sa.svg" alt="AR"></button>
    <button class="lang-btn" id="btn-pt" onclick="setLang('pt')" title="Português"><img src="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/flags/4x3/pt.svg" alt="PT"></button>
    <button class="lang-btn" id="btn-ru" onclick="setLang('ru')" title="Русский"><img src="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/flags/4x3/ru.svg" alt="RU"></button>
    <button class="lang-btn" id="btn-fr" onclick="setLang('fr')" title="Français"><img src="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/flags/4x3/fr.svg" alt="FR"></button>
    <button class="lang-btn" id="btn-sq" onclick="setLang('sq')" title="Shqip"><img src="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/flags/4x3/al.svg" alt="SQ"></button>
    <button class="lang-btn" id="btn-ro" onclick="setLang('ro')" title="Română"><img src="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/flags/4x3/ro.svg" alt="RO"></button>
  </div>
</header>

<div class="titolo-pagina" id="titolo">&nbsp;</div>
<div class="lista" id="lista"><div class="stato">Caricamento...</div></div>

<script>
// Deployment "FINALE" — stesso endpoint del menu del giorno
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxczilq2ynSUZv5cS9BjdpZTIQcDL07ZhOkCgi0QKJuzyOf5cw1EDKRe4WJ67AYynk0Yw/exec';

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

// ?tipo=dolci → dolci, altrimenti menu alla carta
const tipo = new URLSearchParams(location.search).get('tipo') === 'dolci' ? 'dolci' : 'carta';

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function prezzoStr(v) {
  let s = String(v ?? '').replace('€', '').trim();
  if (!s) return '';
  const n = parseFloat(s.replace(',', '.'));
  if (!isNaN(n)) return '€ ' + n.toFixed(2).replace('.', ',');
  return s;
}

const T = {
  it: { carta:'Menù alla Carta', dolci:'Dolci' },
  en: { carta:'À la Carte Menu', dolci:'Desserts' },
  es: { carta:'Menú a la Carta', dolci:'Postres' },
  ar: { carta:'قائمة الطعام', dolci:'الحلويات' },
  pt: { carta:'Menu à la carte', dolci:'Sobremesas' },
  ru: { carta:'Меню а-ля карт', dolci:'Десерты' },
  fr: { carta:'Menu à la carte', dolci:'Desserts' },
  sq: { carta:'Menu à la carte', dolci:'Ëmbëlsira' },
  ro: { carta:'Meniu à la carte', dolci:'Deserturi' }
};

let currentLang = 'it';
const cache = {};
let nomiOriginali = [];

function render(d) {
  const lista = document.getElementById('lista');
  const piatti = (d && d[tipo]) || [];

  // Raggruppa per sezione, nell'ordine del foglio. Una sezione nasce da:
  //  - una riga TUTTA MAIUSCOLA senza prezzo (es. "PRIMI PIATTI"), come già
  //    scritto da Riccardo nella scheda Carta;
  //  - oppure dalla colonna "Sezione" della scheda, se presente.
  const gruppi = [];
  let corrente = null;
  const nuovoGruppo = titolo => {
    corrente = { titolo, piatti: [] };
    gruppi.push(corrente);
  };
  piatti.forEach(p => {
    const nome = String(p.nome || '').trim();
    const prezzo = String(p.prezzo || '').trim();
    const sezione = String(p.sezione || '').trim();
    const eTitolo = !prezzo && /[A-ZÀ-Ù]/.test(nome) && nome === nome.toUpperCase();
    if (eTitolo) { nuovoGruppo(nome); return; }
    if (sezione && (!corrente || corrente.titolo.toLowerCase() !== sezione.toLowerCase())) {
      nuovoGruppo(sezione);
    }
    if (!corrente) nuovoGruppo('');
    corrente.piatti.push(p);
  });

  // Solo per la carta: i contorni si scrivono una volta sola, nel menu del giorno
  if (tipo === 'carta' && d && d.sezioni) {
    const chiave = Object.keys(d.sezioni).find(k => k.includes('contorn'));
    if (chiave && d.sezioni[chiave].length) {
      gruppi.push({
        titolo: 'Contorni',
        piatti: d.sezioni[chiave].map(x => ({ nome: x.nome, prezzo: '' }))
      });
    }
  }

  const totale = gruppi.reduce((n, g) => n + g.piatti.length, 0);
  if (!totale) {
    lista.innerHTML = '<div class="stato">Menu non disponibile. Riprova più tardi.</div>';
    return;
  }

  lista.innerHTML = gruppi.filter(g => g.piatti.length).map(g => {
    const intestazione = g.titolo
      ? `<div class="sezione-titolo js-tr">${esc(g.titolo)}</div>`
      : '';
    return intestazione + g.piatti.map(p => {
      const prezzo = prezzoStr(p.prezzo);
      const destra = prezzo
        ? `<span class="leader"></span><span class="prezzo">${esc(prezzo)}</span>`
        : '';
      return `<div class="piatto"><span class="nome js-tr">${esc(p.nome)}</span>${destra}</div>`;
    }).join('');
  }).join('');

  // Traducibili: nomi dei piatti + titoli di sezione
  nomiOriginali = Array.from(document.querySelectorAll('.js-tr')).map(el => ({
    el,
    testo: el.textContent
  }));
}

async function tradurciPiatti(lang) {
  if (lang === 'it') {
    nomiOriginali.forEach(({ el, testo }) => el.textContent = testo);
    return;
  }

  if (cache[lang]) {
    cache[lang].forEach((testo, i) => {
      if (nomiOriginali[i]) nomiOriginali[i].el.textContent = testo;
    });
    return;
  }

  document.getElementById('lista').classList.add('traduzione-in-corso');

  const SEP = ' || ';
  const testi = nomiOriginali.map(n => n.testo);
  const chunks = [];
  let chunk = [], len = 0;
  for (const t of testi) {
    if (len + t.length + SEP.length > 450 && chunk.length) {
      chunks.push(chunk); chunk = []; len = 0;
    }
    chunk.push(t);
    len += t.length + SEP.length;
  }
  if (chunk.length) chunks.push(chunk);

  try {
    const tradotti = [];
    for (const c of chunks) {
      const q = c.join(SEP);
      const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(q)}&langpair=it|${lang}`);
      const json = await res.json();
      const parti = json.responseData.translatedText.split(SEP);
      tradotti.push(...parti.map((t, i) => t.trim() || c[i]));
    }
    cache[lang] = tradotti;
    tradotti.forEach((testo, i) => {
      if (nomiOriginali[i]) nomiOriginali[i].el.textContent = testo;
    });
  } catch {
    // In caso di errore mantiene i nomi italiani
  }

  document.getElementById('lista').classList.remove('traduzione-in-corso');
}

function applicaTitolo(lang) {
  document.getElementById('titolo').textContent = T[lang][tipo];
  document.title = T.it[tipo] + ' - Tre Stelle';
}

async function setLang(lang) {
  if (lang === currentLang) return;
  currentLang = lang;

  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + lang).classList.add('active');

  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

  applicaTitolo(lang);
  await tradurciPiatti(lang);
}

applicaTitolo('it');

fetch(SCRIPT_URL + '?t=' + Date.now())
  .then(r => r.json())
  .then(d => render(d))
  .catch(() => {
    document.getElementById('lista').innerHTML =
      '<div class="stato">Menu non disponibile. Riprova più tardi.</div>';
  });
</script>
</body>
</html>
